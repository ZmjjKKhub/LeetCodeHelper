<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #181613; }
    a { color: #e7e1d6; text-decoration: none; }
    a:hover { color: #ffffff; }
  </style>
</helmet>

<div style="width: 1120px; height: 760px; box-sizing: border-box; background: #181613; color: #e7e1d6; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; padding: 24px 32px; display: flex; flex-direction: column; gap: 20px;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#968c7c" stroke-width="1.6" stroke-linecap="round">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
        <path d="M8 9h8M8 13h5"></path>
      </svg>
      <span style="font-size: 14px; font-weight: 600;">滑动窗口</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#675f53" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
    <div style="display: flex; gap: 4px; font-size: 12px;">
      <span style="padding: 5px 12px; border-radius: 4px; color: #968c7c;">今日</span>
      <span style="padding: 5px 12px; border-radius: 4px; background: #29251e; color: #f5f0e6;">历史</span>
      <span style="padding: 5px 12px; border-radius: 4px; color: #968c7c;">复习队列</span>
      <span style="padding: 5px 12px; border-radius: 4px; color: #968c7c;">模板库</span>
      <span style="padding: 5px 12px; border-radius: 4px; color: #968c7c;">统计</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;">
    <div style="background: #1f1c18; border: 1px solid #2c2822; border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;">3</span>
      <span style="font-size: 11px; color: #968c7c;">总记录</span>
    </div>
    <div style="background: #1f1c18; border: 1px solid #2c2822; border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;">0<span style="font-size: 13px; color: #756c5e;">%</span></span>
      <span style="font-size: 11px; color: #968c7c;">一次 AC 率</span>
    </div>
    <div style="background: #1f1c18; border: 1px solid #2c2822; border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500; color: #c4826a;">100<span style="font-size: 13px; color: #756c5e;">%</span></span>
      <span style="font-size: 11px; color: #968c7c;">C 类占比</span>
    </div>
    <div style="background: #1f1c18; border: 1px solid #2c2822; border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;">1</span>
      <span style="font-size: 11px; color: #968c7c;">练习天数</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: baseline; gap: 12px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500;">2026-09-01</span>
      <span style="font-size: 12px; color: #968c7c;">第 2 天 · 阶段一 · 定长滑窗</span>
      <span style="flex-grow: 1;"></span>
      <span style="font-size: 11px; color: #c4826a;">3 题全部没做出来</span>
    </div>

    <div style="background: #1f1c18; border: 1px solid #2c2822; border-radius: 6px; overflow: hidden;">
      <div style="display: grid; grid-template-columns: 64px 1fr 96px 180px 72px 72px 72px; gap: 0; padding: 10px 16px; border-bottom: 1px solid #2c2822; font-size: 11px; color: #756c5e; letter-spacing: 0.04em;">
        <span>题号</span>
        <span>题目</span>
        <span>小节</span>
        <span>结论</span>
        <span style="text-align: center;">提交</span>
        <span style="text-align: center;">一次 AC</span>
        <span style="text-align: center;">模板</span>
      </div>

      <div style="display: grid; grid-template-columns: 64px 1fr 96px 180px 72px 72px 72px; align-items: center; padding: 13px 16px; border-bottom: 1px solid #24211c;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #756c5e;">2090</span>
        <span style="display: flex; align-items: center; gap: 8px;"><span style="width: 3px; height: 14px; border-radius: 2px; background: #c19a5c;"></span>半径为 k 的子数组平均值</span>
        <span style="font-size: 12px; color: #968c7c;">§1.1</span>
        <span style="font-size: 12px; color: #c4826a;">没做出来 / 看了题解</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-align: center;">1</span>
        <span style="text-align: center; color: #756c5e;">—</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-align: center; color: #b3aa9b;">A</span>
      </div>

      <div style="display: grid; grid-template-columns: 64px 1fr 96px 180px 72px 72px 72px; align-items: center; padding: 13px 16px; border-bottom: 1px solid #24211c;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #756c5e;">2379</span>
        <span style="display: flex; align-items: center; gap: 8px;"><span style="width: 3px; height: 14px; border-radius: 2px; background: #8fa76a;"></span>得到 K 个黑块的最少涂色次数</span>
        <span style="font-size: 12px; color: #968c7c;">§1.1</span>
        <span style="font-size: 12px; color: #c4826a;">没做出来 / 看了题解</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-align: center;">1</span>
        <span style="text-align: center; color: #756c5e;">—</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-align: center; color: #b3aa9b;">A</span>
      </div>

      <div style="display: grid; grid-template-columns: 64px 1fr 96px 180px 72px 72px 72px; align-items: center; padding: 13px 16px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #756c5e;">2841</span>
        <span style="display: flex; align-items: center; gap: 8px;"><span style="width: 3px; height: 14px; border-radius: 2px; background: #c19a5c;"></span>几乎唯一子数组的最大和</span>
        <span style="font-size: 12px; color: #968c7c;">§1.1</span>
        <span style="font-size: 12px; color: #c4826a;">没做出来 / 看了题解</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-align: center;">1</span>
        <span style="text-align: center; color: #756c5e;">—</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-align: center; color: #b3aa9b;">A</span>
      </div>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 20px; font-size: 11px; color: #756c5e;">
    <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 3px; height: 12px; border-radius: 2px; background: #8fa76a;"></span>简单</span>
    <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 3px; height: 12px; border-radius: 2px; background: #c19a5c;"></span>中等</span>
    <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 3px; height: 12px; border-radius: 2px; background: #c4826a;"></span>困难</span>
    <span style="margin-left: auto;">按天分组，一天一小结；趋势图等到有两周数据再加</span>
  </div>

</div>
</x-dc>
</body>
</html>
