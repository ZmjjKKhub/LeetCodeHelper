- code: F
  name: 分组循环
  language: python
  trigger_signal: 要把数组切成若干「连续且同质」的段，逐段处理。
  pitfalls: |
    内层循环后别忘了 i += 1，否则死循环。
    这个写法的最大价值是不需要特判最后一组——传统写法在循环外补一次统计，
    是分组类题目的头号 bug 来源。
  content: |
    i, n = 0, len(nums)
    while i < n:
        start = i
        while i + 1 < n and <nums[i] 与 nums[i+1] 属于同一组>:
            i += 1
        # 此时 [start, i] 是完整的一组
        ans = max(ans, i - start + 1)
        i += 1                          # 别忘了这一步，否则死循环
