- code: A
  name: 定长滑窗（入 → 更新 → 出）
  language: python
  trigger_signal: 窗口长度固定为 k，题目直接给出 k。
  pitfalls: |
    continue 的位置。忘了它 → 窗口不满就统计；放到出窗之后 → 窗口永远不缩。
  content: |
    def fixed_window(nums, k):
        ans = 0
        s = 0                              # 维护量：可以是 sum / Counter / 0 的个数
        for i, x in enumerate(nums):
            s += x                         # 1. 入
            if i < k - 1:                  # 窗口还没满，继续
                continue
            ans = max(ans, s)              # 2. 更新
            s -= nums[i - k + 1]           # 3. 出（下一轮的左端点是 i-k+2）
        return ans

- code: B
  name: 不定长 · 求最长（越短越合法）
  language: python
  trigger_signal: 题目问「最长」，且窗口越短越容易满足条件。
  pitfalls: |
    更新语句必须在 while 之外——出了 while 窗口才一定合法。
    与模板 C 的唯一结构差异就在这里。
  content: |
    def longest(nums):
        ans = left = 0
        cnt = Counter()
        for right, x in enumerate(nums):
            cnt[x] += 1                          # 入
            while <窗口不合法>:                    # 出：不合法就一直缩
                cnt[nums[left]] -= 1
                if cnt[nums[left]] == 0:
                    del cnt[nums[left]]
                left += 1
            ans = max(ans, right - left + 1)     # 更新（此时窗口一定合法）
        return ans

- code: C
  name: 不定长 · 求最短（越长越合法）
  language: python
  trigger_signal: 题目问「最短 / 最小」，且窗口越长越容易满足条件。
  pitfalls: |
    和模板 B 的关键区别：B 是「先缩到合法再更新」，C 是「合法时边更新边缩」。
    更新语句在 while 内还是 while 外，是这两类题唯一的结构差异，务必刻进脑子。
  content: |
    def shortest(nums, target):
        ans = inf
        left = s = 0
        for right, x in enumerate(nums):
            s += x                               # 入
            while s >= target:                   # 合法就先更新再缩
                ans = min(ans, right - left + 1)
                s -= nums[left]
                left += 1
        return ans if ans < inf else 0

- code: D
  name: 不定长 · 求个数
  language: python
  trigger_signal: 题目问「子数组 / 子串的个数」。先判断是越短越合法、越长越合法，还是恰好型。
  pitfalls: |
    整个题单最高频的面试考点，也是最容易写错的地方。
    D1 关注的是 left 的合法性，D2 关注的是 left-1 的合法性。
  content: |
    # D1. 越短越合法（如：乘积小于 k 的子数组）
    #     内层循环结束后 [left, right] 合法，
    #     则 [left,right], [left+1,right], ..., [right,right] 全合法
    ans += right - left + 1

    # D2. 越长越合法（如：包含全部三种字符的子串）
    #     内层循环结束后 [left, right] 不合法，但 [left-1, right] 合法，
    #     则左端点取 0..left-1 全合法
    ans += left

    # D3. 恰好型 = 两个「至少」相减
    #     恰好等于 k  =  (>= k 的个数) - (>= k+1 的个数)
    def solve(k): ...          # 用 D2 写一份「至少 k」的滑窗
    ans = solve(k) - solve(k + 1)

