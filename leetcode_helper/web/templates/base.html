<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}刷题复盘{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <script src="/static/vendor/htmx.min.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .done { opacity: .55; }
    .panel { border-top: 1px solid var(--pico-muted-border-color); padding-top: .5rem; }
    .row-head { display: flex; gap: .75rem; align-items: baseline; }
    .muted { color: var(--pico-muted-color); font-size: .85em; }
    fieldset.inline { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: .5rem; }
    fieldset.inline label { margin: 0; }
    .error { color: var(--pico-del-color, crimson); }
    .stepper { display: flex; align-items: center; gap: .35rem; }
    .stepper button { width: 2rem; padding: 0 0; margin: 0; }
    .stepper span { min-width: 1.5em; text-align: center; }
    button[aria-pressed="true"].current { outline: 2px solid var(--pico-primary); }

    /* Two-column label/control layout for the entry panel -- every control
       (用时/模板/提交次数/掌握程度) gets a visible label to its left. Falls
       back to a stacked single column on a narrow window instead of letting
       the control row overflow. */
    .field-row { border: none; margin: 0 0 .75rem 0; padding: 0; display: grid; grid-template-columns: 9rem 1fr; gap: .5rem 1rem; align-items: start; }
    .field-row legend { padding: 0; font-weight: 600; grid-column: 1; }
    .field-row .field-control { grid-column: 2; }
    .field-control.inline { display: flex; gap: 1rem; flex-wrap: wrap; }
    .field-control.inline label { margin: 0; }
    .mark-buttons { display: flex; gap: .5rem; flex-wrap: wrap; }
    .mark-hint { margin: .35rem 0 0 0; }
    @media (max-width: 40rem) {
      .field-row { grid-template-columns: 1fr; }
      .field-row legend { grid-column: 1; }
      .field-row .field-control { grid-column: 1; }
    }
  </style>
</head>
<body>
<main class="container">
  <nav>
    <ul><li><strong>{% block heading %}刷题复盘{% endblock %}</strong></li></ul>
    <ul>
      <li><a href="/today">今日</a></li>
      <li><a href="/history">历史</a></li>
    </ul>
  </nav>
  {% block content %}{% endblock %}
</main>
<script>
  // POST /attempts returns an HTML fragment (scoped to the same #problem-N
  // row the form targeted) even on 404/422 -- see routes/today.py. HTMX's
  // default responseHandling only swaps 2xx/3xx, so without this hook a
  // validation error would leave the user with silent, invisible failure.
  // Scoped to /attempts specifically -- other HTMX callers (e.g. /history)
  // should keep HTMX's normal error handling (including its console
  // logging, which this hook otherwise suppresses via isError = false).
  document.body.addEventListener('htmx:beforeSwap', function (evt) {
    var path = evt.detail.requestConfig && evt.detail.requestConfig.path;
    if (path === '/attempts' && (evt.detail.xhr.status === 404 || evt.detail.xhr.status === 422)) {
      evt.detail.shouldSwap = true;
      evt.detail.isError = false;
    }
  });
</script>
</body>
</html>
